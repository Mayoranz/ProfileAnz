<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgMuslimGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1B5E20" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#0B1911" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070D09" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="emeraldIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="50%" stop-color="#1B5E20"/>
      <stop offset="100%" stop-color="#0D3B13"/>
    </linearGradient>
    <linearGradient id="islamicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background Stage -->
  <rect width="800" height="500" fill="url(#bgMuslimGlow)"/>
  <g stroke="#FFD54F" stroke-opacity="0.1" stroke-width="1">
    <circle cx="400" cy="195" r="175" fill="none"/>
    <circle cx="400" cy="195" r="215" fill="none" stroke-dasharray="6 8"/>
  </g>

  <!-- Android App Squircle Icon -->
  <g filter="url(#iconShadow)" transform="translate(290, 85)">
    <rect x="0" y="0" width="220" height="220" rx="52" fill="url(#emeraldIcon)" stroke="url(#islamicGold)" stroke-width="3.5"/>
    <path d="M52,0 H168 A52,52 0 0,1 220,52 V90 Q110,125 0,90 V52 A52,52 0 0,1 52,0 Z" fill="#FFFFFF" fill-opacity="0.07"/>

    <!-- Mosque Dome Arch & Crescent Moon + Open Quran Symbol -->
    <!-- Outer Mihrab Arch -->
    <path d="M56,170 V106 C56,72 110,44 110,44 C110,44 164,72 164,106 V170 Z" fill="#09270D" fill-opacity="0.65" stroke="url(#islamicGold)" stroke-width="3.5"/>

    <!-- Crescent Moon & Star at Top -->
    <path d="M118,68 A16,16 0 1,1 98,88 A13,13 0 1,0 118,68 Z" fill="url(#islamicGold)"/>
    <circle cx="122" cy="82" r="3" fill="#FFF59D"/>

    <!-- Open Al-Quran Book Base -->
    <path d="M68,148 Q90,138 110,148 Q130,138 152,148 V166 Q130,156 110,166 Q90,156 68,166 Z" fill="url(#islamicGold)"/>
    <line x1="110" y1="146" x2="110" y2="167" stroke="#09270D" stroke-width="2.5"/>
  </g>

  <!-- App Title & Android Badge -->
  <text x="400" y="365" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="34" letter-spacing="1.5">appMuslim</text>
  <text x="400" y="395" text-anchor="middle" fill="#FFD54F" font-family="monospace" font-weight="600" font-size="14" letter-spacing="2.5">AL-QUR'AN • JADWAL SHALAT • DOA • KIBLAT</text>
  <rect x="315" y="416" width="170" height="28" rx="14" fill="#1B5E20" fill-opacity="0.45" stroke="#FFD54F" stroke-width="1"/>
  <text x="400" y="435" text-anchor="middle" fill="#FFE082" font-family="monospace" font-weight="700" font-size="11" letter-spacing="2">APK LOGO SPEC</text>
</svg>
