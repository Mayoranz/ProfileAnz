<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1B5E20" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#0D1610" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090B0A" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#43A047"/>
      <stop offset="50%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#FF8F00"/>
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Background Presentation Stage -->
  <rect width="800" height="500" fill="url(#bgGlow)"/>
  <g stroke="#2E7D32" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="250" x2="800" y2="250"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Android App Squircle Icon -->
  <g filter="url(#dropShadow)" transform="translate(290, 85)">
    <rect x="0" y="0" width="220" height="220" rx="52" fill="url(#iconGrad)" stroke="#66BB6A" stroke-width="3" stroke-opacity="0.5"/>
    <!-- Inner Subtle Gloss -->
    <path d="M52,0 H168 A52,52 0 0,1 220,52 V95 Q110,130 0,95 V52 A52,52 0 0,1 52,0 Z" fill="#FFFFFF" fill-opacity="0.08"/>

    <!-- Shield & Z Monogram + Star Point -->
    <path d="M110,34 L172,58 V114 C172,154 145,182 110,194 C75,182 48,154 48,114 V58 L110,34 Z" fill="#0F2914" fill-opacity="0.55" stroke="url(#goldGrad)" stroke-width="4"/>

    <!-- Stylized 'Z' inside Shield -->
    <path d="M82,78 H138 L92,138 H140" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Gold Achievement Star Badge -->
    <circle cx="164" cy="58" r="24" fill="#0F2914" stroke="url(#goldGrad)" stroke-width="3"/>
    <polygon points="164,42 169,52 180,54 172,61 174,72 164,67 154,72 156,61 148,54 159,52" fill="url(#goldGrad)"/>
  </g>

  <!-- App Title & Android Badge -->
  <text x="400" y="365" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="800" font-size="34" letter-spacing="2">ZIEPOINT</text>
  <text x="400" y="395" text-anchor="middle" fill="#81C784" font-family="monospace" font-weight="600" font-size="14" letter-spacing="3">FLUTTER ANDROID APP // STUDENT POINT SYSTEM</text>
  <rect x="315" y="416" width="170" height="28" rx="14" fill="#2E7D32" fill-opacity="0.3" stroke="#4CAF50" stroke-width="1"/>
  <text x="400" y="435" text-anchor="middle" fill="#A5D6A7" font-family="monospace" font-weight="700" font-size="11" letter-spacing="2">APK LOGO SPEC</text>
</svg>
